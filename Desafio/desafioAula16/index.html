<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário XYZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Formulário XYZ</h1>

    <fieldset>
        <legend>Form Name</legend>

        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="placeholder">
            <small>help</small>
            <br><br>

            <label for="nascimento">Data Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento">
            <small>help</small>
            <br><br>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" placeholder="placeholder">
            <small>help</small>
            <br><br>

            <label for="numero">Nro:</label>
            <input type="number" id="numero" name="numero" placeholder="placeholder">
            <small>help</small>
            <br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="placeholder">
            <small>help</small>
            <br><br>

            <label for="estado">Estado:</label>
            <select id="estado" name="estado">
                <option value="">Option one</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
            </select>
            <br><br>

            <label for="sexo">Sexo:</label>
            <select id="sexo" name="sexo">
                <option value="">Option one</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select>
            <br><br>

            <label>Bens Pessoais:</label><br>
            <input type="checkbox" id="casa" name="bens" value="casa">
            <label for="casa">Casa</label><br>

            <input type="checkbox" id="carro" name="bens" value="carro">
            <label for="carro">Carro</label><br>

            <input type="checkbox" id="moto" name="bens" value="moto">
            <label for="moto">Moto</label>
            <br><br>

            <label for="experiencias">Text Area</label>
            <textarea id="experiencias" name="experiencias" placeholder="Experiências Pessoais:"></textarea>
            <br><br>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </fieldset>

</body>
</html>
